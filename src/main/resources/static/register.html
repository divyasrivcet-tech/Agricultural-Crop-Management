<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Registration | Agriculture Management</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-container">
    <div class="brand">🌱 AGRICULTURE MANAGEMENT</div>
    <h1>Create Account</h1>
    <p class="subtitle">Register as a staff member to access the system.</p>

    <div class="message error" id="errorMessage" hidden></div>

    <form id="registerForm">
        <label for="fullName">Full Name</label>
        <input id="fullName" name="fullName" type="text" placeholder="Enter your full name" required>

        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Choose a username" required>

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" placeholder="At least 8 characters" required>

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" placeholder="Re-enter your password" required>

        <button type="submit" id="registerButton">Create Staff Account</button>
    </form>

    <p class="signup">Already registered? <a href="/login.html">Back to Login</a></p>
    <p class="footer">Secure Staff Registration · Crop Management System</p>
</div>

<script>
const form = document.getElementById('registerForm');
const errorMessage = document.getElementById('errorMessage');
const registerButton = document.getElementById('registerButton');

form.addEventListener('submit', async function(event) {
    event.preventDefault();
    errorMessage.hidden = true;

    const data = Object.fromEntries(new FormData(form).entries());

    if (data.password !== data.confirmPassword) {
        errorMessage.textContent = 'Passwords do not match.';
        errorMessage.hidden = false;
        return;
    }

    registerButton.disabled = true;
    registerButton.textContent = 'Creating Account...';

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.detail || result.message || 'Registration failed.');
        }

        window.location.href = '/login.html?registered=true';
    } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.hidden = false;
    } finally {
        registerButton.disabled = false;
        registerButton.textContent = 'Create Staff Account';
    }
});
</script>
</body>
</html>
